[package]
name = "homeborismygitslovo"
version = "0.1.0"
description = "Linux-first push-to-talk transcription"
authors = ["Slovo contributors"]
edition = "2021"

[lib]
name = "homeborismygitslovo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3"
cpal = "0.15"
enigo = { version = "0.2", default-features = false, features = ["x11rb"] }
hound = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time", "macros", "rt", "sync"] }
url = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
async-trait = "0.1"
futures-util = "0.3"
