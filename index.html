<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Слово — Настройки диктовки</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
              <path d="M6 11a6 6 0 0 0 12 0M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <div class="brand-text">
            <h1>Слово</h1>
            <p class="brand-sub">Настройки диктовки</p>
          </div>
        </div>
        <div class="status" id="status" role="status" aria-live="polite" aria-atomic="true" data-kind="ready">
          <span class="status-mark" id="status-mark" aria-hidden="true"></span>
          <span class="status-text" id="status-text">Готово</span>
        </div>
      </header>

      <form id="settings-form" class="card" novalidate>
        <div class="setting-row stacked">
          <div class="setting-copy">
            <label id="hotkey-label" class="setting-label">Сочетание клавиш</label>
          </div>
          <div class="setting-control">
            <button
              type="button"
              id="hotkey-control"
              class="hotkey-control"
              aria-labelledby="hotkey-label"
              aria-describedby="hotkey-help"
            >
              <span class="hotkey-value" id="hotkey-value">—</span>
              <span class="hotkey-hint" id="hotkey-help">Нажмите, чтобы изменить</span>
            </button>
          </div>
        </div>

        <div class="divider" role="separator"></div>

        <div class="setting-row">
          <div class="setting-copy">
            <label for="server-url" class="setting-label">Сервер распознавания</label>
          </div>
          <div class="setting-control">
            <input
              type="url"
              id="server-url"
              name="server-url"
              class="text-input"
              placeholder="http://127.0.0.1:8072"
              spellcheck="false"
              autocomplete="off"
            />
            <p class="setting-help server-help" id="server-help">Полный адрес с http:// или https://</p>
            <p class="setting-error" id="server-error" aria-live="polite"></p>
          </div>
        </div>

        <div class="divider" role="separator"></div>

        <div class="setting-row stacked">
          <div class="setting-copy">
            <label for="input-device" class="setting-label">Устройство ввода</label>
          </div>
          <div class="setting-control">
            <select id="input-device" name="input-device" class="select-input">
              <option value="">Системное по умолчанию</option>
            </select>
          </div>
        </div>

        <div class="divider" role="separator"></div>

        <div class="setting-row trigger-row stacked">
          <div class="setting-copy">
            <span class="setting-label">Запуск записи</span>
          </div>
          <div class="setting-control">
            <div class="trigger-options" role="radiogroup" aria-label="Тип срабатывания">
              <label class="trigger-option">
                <input type="radio" name="triggerType" value="toggle" />
                <span class="trigger-label">Перекл.</span>
              </label>
              <label class="trigger-option">
                <input type="radio" name="triggerType" value="hold" />
                <span class="trigger-label">Удержание</span>
              </label>
              <label class="trigger-option">
                <input type="radio" name="triggerType" value="auto-vad" />
                <span class="trigger-label">Авто-VAD</span>
              </label>
            </div>
            <p class="setting-help" id="trigger-help">Нажмите один раз для старта и ещё раз для остановки</p>
          </div>
        </div>

        <div class="divider" role="separator"></div>

        <!-- Временная диагностика окна индикатора; удалить после проверки Wayland. -->
        <div class="setting-row stacked">
          <div class="setting-copy">
            <span class="setting-label">Проверка индикатора</span>
          </div>
          <div class="setting-control">
            <button type="button" id="overlay-debug-toggle" class="hotkey-control">
              Показать индикатор
            </button>
            <p class="setting-help">Временная проверка окна без запуска записи</p>
          </div>
        </div>
      </form>

      <div class="error-banner hidden" id="error-banner" role="alert" aria-live="assertive">
        <span class="error-icon" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="8" x2="12" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="16.5" r="1" fill="currentColor"/>
          </svg>
        </span>
        <span class="error-text" id="error-message">Ошибка</span>
        <button type="button" id="retry-button" class="retry-button">Повторить</button>
      </div>

      <footer class="app-footer" data-save-kind="idle">
        <span class="save-indicator" id="save-state">
          <span class="save-dot" aria-hidden="true"></span>
          <span class="save-label">Изменения сохраняются автоматически</span>
        </span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
