<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Слово</title>
    <style>
      :root { background: #fafafa; }
      @media (prefers-color-scheme: dark) { :root { background: #121214; } }
      html, body, #root { width: 100%; min-height: 100%; margin: 0; }
      .startup-shell { display: grid; min-height: 100vh; place-items: center; }
      .startup-mark { width: 42px; height: 42px; animation: startup-pulse 1.6s ease-in-out infinite; }
      @keyframes startup-pulse { 0%, 100% { opacity: .55; filter: brightness(.9); } 50% { opacity: 1; filter: brightness(1.1); } }
      @media (prefers-reduced-motion: reduce) { .startup-mark { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="startup-shell" aria-label="Слово" aria-busy="true">
        <svg class="startup-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="7" width="2.6" height="10" rx="1.3" fill="#6547e8" />
          <rect x="7" y="4" width="2.6" height="16" rx="1.3" fill="#6547e8" />
          <rect x="11" y="2.5" width="2.6" height="19" rx="1.3" fill="#6547e8" />
          <rect x="15" y="4" width="2.6" height="16" rx="1.3" fill="#6547e8" />
          <rect x="19" y="7" width="2.6" height="10" rx="1.3" fill="#6547e8" />
        </svg>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
